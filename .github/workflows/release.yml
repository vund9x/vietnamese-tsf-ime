name: Build and release Neokey

on:
  push:
    tags:
      - "v*"
      - "!v*-dev*"
      - "!v*-alpha*"
      - "!v*-beta*"
      - "!v*-rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable Git tag to build and release (for example v0.1.21)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Windows packages and publish stable release
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Tag must look like v0.1.21; received: $tag"
          }
          if ($tag -match '-(dev|alpha|beta|rc)([.-].*)?$') {
            throw "Development/prerelease tags are managed by rolling-dev.yml, not this stable release workflow."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout source at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate VERSION matches tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim() -replace '^v', ''
          $tagVersion = "${{ steps.release.outputs.tag }}".Substring(1)
          if ($version -ne $tagVersion) {
            throw "VERSION ($version) must match release tag ($tagVersion)."
          }

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "7.1.0"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version-x64.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-$version-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Inno Setup installer signature validation failed."
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer failed with exit code $($process.ExitCode)." }
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 7 ISCC.exe was not found after installation." }
          "INNO_COMPILER=$iscc" >> $env:GITHUB_ENV

      - name: Build and package x64/x86 installer and ARM64 preview
        shell: pwsh
        run: |
          # Run tests separately so failures can be reported without hiding packaging failures.
          & ./package.bat -SkipTests -Zip -Installer -Arm64Preview -InnoCompiler "$env:INNO_COMPILER"
          if ($LASTEXITCODE -ne 0) { throw "package.bat failed with exit code $LASTEXITCODE" }

      - name: Run tests and write release report
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportPath = "dist/TEST-RESULTS.md"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("# Automated test results")
          $lines.Add("")
          $lines.Add("- **Release tag:** ${{ steps.release.outputs.tag }}")
          $lines.Add("- **Commit:** ${{ github.sha }}")
          $lines.Add("- **Runner:** Windows Server 2022")
          $lines.Add("")
          $totalPassed = 0
          $totalFailed = 0
          $anyTestFailed = $false

          foreach ($testName in @("core_tests.exe", "core_tests32.exe", "setup_tests.exe")) {
            $testPath = Join-Path "build/package" $testName
            $logPath = Join-Path $env:RUNNER_TEMP "$testName.log"
            $lines.Add("## $testName")

            if (-not (Test-Path -LiteralPath $testPath -PathType Leaf)) {
              $lines.Add("- **Result:** NOT RUN — executable missing (build may have failed)")
              $lines.Add("")
              $anyTestFailed = $true
              continue
            }

            & $testPath *> $logPath
            $exitCode = $LASTEXITCODE
            Get-Content -LiteralPath $logPath | ForEach-Object { Write-Host $_ }
            $log = Get-Content -LiteralPath $logPath -Raw

            $passed = 0
            $failed = 0
            if ($log -match '(?m)PASSED:\s*(\d+)') { $passed = [int]$Matches[1] }
            if ($log -match '(?m)FAILED:\s*(\d+)') { $failed = [int]$Matches[1] }
            $totalPassed += $passed
            $totalFailed += $failed

            if ($exitCode -eq 0) {
              $lines.Add("- **Result:** PASSED (exit code 0)")
            } else {
              $lines.Add("- **Result:** FAILED (exit code $exitCode)")
              $anyTestFailed = $true
            }
            $lines.Add("- Passed: $passed")
            $lines.Add("- Failed: $failed")
            $lines.Add("")
            $lines.Add("Log excerpt (last 35 lines):")
            $excerpt = @(Get-Content -LiteralPath $logPath | Select-Object -Last 35)
            foreach ($entry in $excerpt) { $lines.Add("    $entry") }
            $lines.Add("")
          }

          $overall = if ($anyTestFailed -or $totalFailed -gt 0) { "FAILED" } else { "PASSED" }
          $lines.Insert(4, "- **Overall:** $overall")
          $lines.Add("## Summary")
          $lines.Add("")
          $lines.Add("- **Passed:** $totalPassed")
          $lines.Add("- **Failed:** $totalFailed")
          $lines.Add("")
          if ($overall -eq "FAILED") {
            $lines.Add("> Tests failed. This report is informational: test failures do not block publication, but are not treated as passing.")
          } else {
            $lines.Add("> All executed tests passed.")
          }
          $lines | Set-Content -LiteralPath $reportPath -Encoding utf8
          Write-Host "Wrote test report to $reportPath (overall: $overall)."

      - name: Scan release artifacts with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command Update-MpSignature -ErrorAction SilentlyContinue) -or
              -not (Get-Command Start-MpScan -ErrorAction SilentlyContinue) -or
              -not (Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue)) {
            throw "Microsoft Defender scanning cmdlets are unavailable on this runner."
          }

          Update-MpSignature
          $scanRoot = (Resolve-Path "dist").Path
          $expandedRoot = Join-Path $env:RUNNER_TEMP "neokey-scan-expanded"
          New-Item -ItemType Directory -Force -Path $expandedRoot | Out-Null

          # Expand archives as well, so their contents are scanned independently.
          Get-ChildItem -Path $scanRoot -Filter "*.zip" -File | ForEach-Object {
            $target = Join-Path $expandedRoot $_.BaseName
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Expand-Archive -LiteralPath $_.FullName -DestinationPath $target -Force
          }

          $scanPaths = @($scanRoot, $expandedRoot)
          $scanStarted = Get-Date
          foreach ($scanPath in $scanPaths) {
            Write-Host "Microsoft Defender custom scan: $scanPath"
            Start-MpScan -ScanType CustomScan -ScanPath $scanPath
          }

          $detections = @(Get-MpThreatDetection | Where-Object {
            $_.InitialDetectionTime -and $_.InitialDetectionTime -ge $scanStarted.AddMinutes(-2)
          })
          if ($detections.Count -gt 0) {
            $detections | Format-List ThreatID,ThreatStatusID,InitialDetectionTime,Resources | Out-String | Write-Host
            throw "Microsoft Defender reported one or more recent threats. Release publication is blocked."
          }
          Write-Host "Microsoft Defender scan completed without reported detections."

      - name: Prepare release assets and checksums
        shell: pwsh
        run: |
          $assets = @(
            "dist/NeokeySetup.exe",
            "dist/Neokey-portable.zip",
            "dist/Neokey-arm64-preview.zip"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Missing expected release asset: $asset" }
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path $asset -Leaf)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Generate signed build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/NeokeySetup.exe
            dist/Neokey-portable.zip
            dist/Neokey-arm64-preview.zip
            dist/SHA256SUMS.txt

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh release view "$env:RELEASE_TAG" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "A release for $env:RELEASE_TAG already exists. Refusing to overwrite it."
          }
          if (-not (Test-Path "dist/TEST-RESULTS.md" -PathType Leaf)) {
            throw "Test report is missing; refusing to create a release without test results."
          }
          gh release create "$env:RELEASE_TAG" dist/NeokeySetup.exe dist/Neokey-portable.zip dist/Neokey-arm64-preview.zip dist/SHA256SUMS.txt dist/TEST-RESULTS.md --draft --title "Neokey $($env:RELEASE_TAG)" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release." }

          # Preserve GitHub's generated changelog and append the actual test results.
          $generatedNotes = gh release view "$env:RELEASE_TAG" --json body --jq ".body"
          if ($LASTEXITCODE -ne 0) { throw "Failed to read generated release notes." }
          $testReport = Get-Content "dist/TEST-RESULTS.md" -Raw
          @($generatedNotes, "", "---", "", $testReport) | Set-Content "dist/RELEASE_NOTES.md" -Encoding utf8
          gh release edit "$env:RELEASE_TAG" --notes-file "dist/RELEASE_NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw "Failed to append test results to release notes." }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          gh release edit "$env:RELEASE_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release." }
