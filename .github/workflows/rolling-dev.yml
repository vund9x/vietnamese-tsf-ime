name: Build rolling dev pre-release

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/rolling-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-dev-prerelease
  cancel-in-progress: false

jobs:
  build-dev:
    name: Build and update rolling dev pre-release
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read VERSION and resolve rolling tag
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $version = $version -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+-dev(?:[.-][0-9A-Za-z.-]+)?$') {
            throw "This workflow only publishes dev versions. VERSION must look like 0.1.21-dev or 0.1.21-dev.1; found: $version"
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 7 ISCC.exe was not found after installation." }
          "INNO_COMPILER=$iscc" >> $env:GITHUB_ENV

      - name: Build, test, and package
        shell: pwsh
        run: |
          ./package.bat -Zip -Installer -Arm64Preview -InnoCompiler "$env:INNO_COMPILER"
          if ($LASTEXITCODE -ne 0) { throw "package.bat failed with exit code $LASTEXITCODE" }

      - name: Prepare checksums
        shell: pwsh
        run: |
          $assets = @(
            "dist/NeokeySetup.exe",
            "dist/Neokey-portable.zip",
            "dist/Neokey-arm64-preview.zip"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Missing expected release asset: $asset" }
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path $asset -Leaf)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/NeokeySetup.exe
            dist/Neokey-portable.zip
            dist/Neokey-arm64-preview.zip
            dist/SHA256SUMS.txt

      - name: Update rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CURRENT_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin main --tags

          $previousSha = $null
          $releaseExists = $false
          $releaseInfoJson = gh release view "$env:RELEASE_TAG" --json tagName,body,isPrerelease 2>$null
          $releaseViewExit = $LASTEXITCODE
          if ($releaseViewExit -eq 0) {
            $releaseExists = $true
            $info = ($releaseInfoJson -join "`n") | ConvertFrom-Json
            $previousTagSha = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) { $previousSha = "$previousTagSha".Trim() }
          }

          $currentSha = "$env:CURRENT_SHA".Trim()
          if ($previousSha -and $previousSha -ne $currentSha) {
            $commitLines = git log --reverse --format="* %s (%h)" "$previousSha..$currentSha"
          } else {
            $commitLines = git log -n 20 --reverse --format="* %s (%h)" "$currentSha"
          }
          if (-not $commitLines) { $commitLines = @("* Automated build of commit $($currentSha.Substring(0, 7)).") }
          $notes = @(
            "## Neokey $env:RELEASE_VERSION (development build)",
            "",
            "Automatically built from commit [$($currentSha.Substring(0, 7))](https://github.com/$env:GITHUB_REPOSITORY/commit/$currentSha).",
            "",
            "### Changes since the previous dev build",
            ($commitLines -join "`n"),
            "",
            "> This is an automatically updated development pre-release. It may contain bugs and is not a stable release."
          ) -join "`n"

          if ($releaseExists) {
            gh release upload "$env:RELEASE_TAG" dist/NeokeySetup.exe dist/Neokey-portable.zip dist/Neokey-arm64-preview.zip dist/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to replace assets in the existing pre-release." }
            gh release edit "$env:RELEASE_TAG" --title "Neokey $env:RELEASE_VERSION (dev)" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw "Failed to update existing pre-release notes." }
          } else {
            gh release create "$env:RELEASE_TAG" dist/NeokeySetup.exe dist/Neokey-portable.zip dist/Neokey-arm64-preview.zip dist/SHA256SUMS.txt --title "Neokey $env:RELEASE_VERSION (dev)" --notes "$notes" --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to create initial dev pre-release." }
          }

          # Move the rolling tag only after assets and notes have been updated.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$env:RELEASE_TAG" "$currentSha"
          git push origin "refs/tags/$env:RELEASE_TAG" --force
          if ($LASTEXITCODE -ne 0) { throw "Failed to move rolling dev tag." }
